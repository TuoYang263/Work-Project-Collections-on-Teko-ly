name: Olist Pipeline CI/CD

on:
  push:
    branches:
      - feature/olist-analytics-portal
      - main
    paths:
      - "Projects/Olist-Ecommerce-Analytics-Portal/dbt/**"
      - ".github/workflows/olist-pipeline-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Projects/Olist-Ecommerce-Analytics-Portal/dbt/**"
      - ".github/workflows/olist-pipeline-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            google-cloud-bigquery \
            google-genai \
            PyYAML

      - name: Test window controller
        working-directory: Projects/Olist-Ecommerce-Analytics-Portal
        run: |
          python -m unittest discover \
            -s dbt/control/window_controller/tests \
            -t dbt/control \
            -v

      - name: Test monitoring resolver
        working-directory: Projects/Olist-Ecommerce-Analytics-Portal
        run: |
          python -m unittest discover \
            -s dbt/monitoring/tests \
            -t dbt \
            -v

      - name: Test pipeline reviewer
        working-directory: Projects/Olist-Ecommerce-Analytics-Portal
        run: |
          python -m unittest discover \
            -s dbt/monitoring/reviewer/tests \
            -p "test_*.py" \
            -v

      - name: Validate pipeline entrypoint
        working-directory: Projects/Olist-Ecommerce-Analytics-Portal
        run: bash -n dbt/run_dbt_job.sh

      - name: Build pipeline image
        working-directory: Projects/Olist-Ecommerce-Analytics-Portal
        run: |
          docker build \
            -f dbt/Dockerfile \
            -t olist-dbt-ci:${{ github.sha }} \
            .

      - name: Smoke test pipeline image
        run: |
          docker run --rm \
            --entrypoint bash \
            olist-dbt-ci:${{ github.sha }} \
            -lc '
              set -e

              test -f /app/dbt/control/run_window_controller.py
              test -f /app/dbt/monitoring/monitoring_run_resolver.py
              test -f /app/dbt/monitoring/reviewer/src/pipeline_reviewer/evaluator.py

              grep -q "CONTROL_WINDOW_START" /app/dbt/run_dbt_job.sh
              grep -q "CONTROL_WINDOW_END" /app/dbt/run_dbt_job.sh

              python -c "from google.cloud import bigquery; from google import genai; import yaml"

              echo "Pipeline image smoke check passed."
            '

  deploy:
    name: Deploy Pipeline to GCP
    needs: validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: balmy-nuance-468118-g4
      CLOUD_RUN_REGION: europe-north1
      AR_REPOSITORY: olist-dbt-jobs
      IMAGE_NAME: olist-dbt-job
      CLOUD_RUN_JOB: olist-dbt-build-job
      WIF_PROVIDER: projects/508184525866/locations/global/workloadIdentityPools/github-actions/providers/olist-repo
      DEPLOY_SA: olist-github-deployer@balmy-nuance-468118-g4.iam.gserviceaccount.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker \
            "${CLOUD_RUN_REGION}-docker.pkg.dev" \
            --quiet

      - name: Build and push pipeline image
        working-directory: Projects/Olist-Ecommerce-Analytics-Portal
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          REMOTE_IMAGE="${CLOUD_RUN_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "REMOTE_IMAGE=${REMOTE_IMAGE}" >> "${GITHUB_ENV}"

          docker build \
            -f dbt/Dockerfile \
            -t "${REMOTE_IMAGE}" \
            .

          docker push "${REMOTE_IMAGE}"

      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update "${CLOUD_RUN_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${CLOUD_RUN_REGION}" \
            --image="${REMOTE_IMAGE}" \
            --quiet

      - name: Verify deployed image
        run: |
          DEPLOYED_IMAGE="$(
            gcloud run jobs describe "${CLOUD_RUN_JOB}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${CLOUD_RUN_REGION}" \
              --format='value(spec.template.spec.template.spec.containers[0].image)'
          )"

          echo "Expected: ${REMOTE_IMAGE}"
          echo "Deployed: ${DEPLOYED_IMAGE}"

          test "${DEPLOYED_IMAGE}" = "${REMOTE_IMAGE}"
