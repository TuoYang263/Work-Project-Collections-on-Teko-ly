name: Wake NYC Streamlit App

on:
  schedule:
    - cron: "*/10 * * * *"  # every 20 minutes
  workflow_dispatch: {}

jobs:
  wake-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake backend via status API
        shell: bash
        run: |
          set -euo pipefail

          APP="nyc-taxi-dashboard"
          STATUS_URL="https://${APP}.streamlit.app/api/v2/app/status"
          TS="$(date +%s)"

          echo "Wake ping started at: $(date -u)"
          echo "Target (status): ${STATUS_URL}"

          # staggered retries to handle cold start / transient network
          delays=(0 5 10 20)

          for idx in "${!delays[@]}"; do
            sleep "${delays[$idx]}"

            code="$(curl -sS \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              -H "User-Agent: github-actions-wake/1.0" \
              -o /dev/null \
              -w "%{http_code}" \
              "${STATUS_URL}?t=${TS}&try=$((idx+1))" || true)"

            echo "Attempt $((idx+1)) -> HTTP ${code}"

            if [[ "${code}" == "200" ]]; then
              echo "Backend OK"
              exit 0
            fi
          done

          echo "Wake failed: status API never returned 200"
          exit 1

        - name: Touch homepage (browser-like)
          if: always()
          shell: bash
          run: |
            set -euo pipefail

            APP="nyc-taxi-dashboard"
            HOME_URL="https://${APP}.streamlit.app/?wake=$(date +%s)"

            echo "Touch home (follow limited redirects): ${HOME_URL}"

            touch_once() {
              curl -sS \
                --connect-timeout 10 \
                --max-time 30 \
                --location \
                --max-redirs 5 \
                -H "Cache-Control: no-cache" \
                -H "Pragma: no-cache" \
                -H "Accept: text/html" \
                -H "User-Agent: github-actions-wake/1.0" \
                -o /dev/null \
                -w "%{http_code}" \
                "${HOME_URL}" || true
            }

            code1="$(touch_once)"
            echo "Home attempt 1 -> HTTP ${code1}"

            sleep 10

            code2="$(touch_once)"
            echo "Home attempt 2 -> HTTP ${code2}"

            exit 0