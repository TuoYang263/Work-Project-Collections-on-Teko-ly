name: Wake NYC Streamlit App

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes
  workflow_dispatch: {}

jobs:
  wake-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake backend via status API
        shell: bash
        run: |
          set -euo pipefail

          APP="nyc-taxi-dashboard"
          STATUS_URL="https://${APP}.streamlit.app/api/v2/app/status"
          TS="$(date +%s)"

          echo "Wake ping started at: $(date -u)"
          echo "Target (status): ${STATUS_URL}"

          # staggered retries to handle cold start / transient network
          delays=(0 5 10 20)

          for idx in "${!delays[@]}"; do
            sleep "${delays[$idx]}"

            code="$(curl -sS \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              -H "User-Agent: github-actions-wake/1.0" \
              -o /dev/null \
              -w "%{http_code}" \
              "${STATUS_URL}?t=${TS}&try=$((idx+1))" || true)"

            echo "Attempt $((idx+1)) -> HTTP ${code}"

            if [[ "${code}" == "200" ]]; then
              echo "Backend OK"
              exit 0
            fi
          done

          echo "Wake failed: status API never returned 200"
          exit 1

      - name: Touch homepage (detect Zzzz and retry)
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          APP="nyc-taxi-dashboard"
          HOME_URL="https://${APP}.streamlit.app/?wake=$(date +%s)"

          echo "Touch home: ${HOME_URL}"

          fetch_once () {
            # -L follow redirects, save body
            body="$(curl -sS -L \
              --connect-timeout 10 \
              --max-time 30 \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              -H "User-Agent: github-actions-wake/1.0" \
              "${HOME_URL}" || true)"

            # keep a small snippet for logs (optional)
            echo "Body length: ${#body}"

            # Detect Streamlit sleep page signals
            if echo "$body" | grep -qiE "Zzzz|gone to sleep|get this app back up"; then
              echo "Detected Zzzz sleep page"
              return 1
            fi

            echo "Homepage seems awake (no Zzzz text found)"
            return 0
          }

          # Try multiple times (wake can take time)
          delays=(0 10 20 40)
          for d in "${delays[@]}"; do
            sleep "$d"
            if fetch_once; then
              exit 0
            fi
            echo "Not awake yet, retrying..."
          done

          echo "Still Zzzz after retries (will rely on external monitor / next schedule)"
          exit 0
