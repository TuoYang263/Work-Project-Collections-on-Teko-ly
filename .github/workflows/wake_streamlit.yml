name: Wake NYC Streamlit App

on:
  schedule:
    - cron: "*/20 * * * *"  # every 20 minutes
  workflow_dispatch: {}

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit status API
        shell: bash
        run: |
          set -e

          BASE="https://nyc-taxi-dashboard.streamlit.app/api/v2/app/status"
          TS=$(date +%s)

          echo "Wake ping started at: $(date)"
          echo "Target: ${BASE}"

          for i in 1 2 3; do
            STATUS=$(curl -sS \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              -A "Mozilla/5.0" \
              -o /dev/null \
              -w "%{http_code}" \
              "${BASE}?t=${TS}&try=${i}")

            echo "Attempt $i -> HTTP ${STATUS}"

            if [[ "$STATUS" == "200" ]]; then
              echo "OK"
              exit 0
            fi

            sleep 6
          done

          echo "Wake failed"
          exit 1