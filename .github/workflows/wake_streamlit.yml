name: Wake NYC Streamlit App

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes
  workflow_dispatch: {}

jobs:
  wake-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake backend via status API
        shell: bash
        run: |
          set -euo pipefail

          APP="nyc-taxi-dashboard"
          STATUS_URL="https://${APP}.streamlit.app/api/v2/app/status"
          TS="$(date +%s)"

          echo "Wake ping started at: $(date -u)"
          echo "Target (status): ${STATUS_URL}"

          # staggered retries to handle cold start / transient network
          delays=(0 5 10 20)

          for idx in "${!delays[@]}"; do
            sleep "${delays[$idx]}"

            code="$(curl -sS \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              -H "User-Agent: github-actions-wake/1.0" \
              -o /dev/null \
              -w "%{http_code}" \
              "${STATUS_URL}?t=${TS}&try=$((idx+1))" || true)"

            echo "Attempt $((idx+1)) -> HTTP ${code}"

            if [[ "${code}" == "200" ]]; then
              echo "Backend OK"
              exit 0
            fi
          done

          echo "Wake failed: status API never returned 200"
          exit 1

      - name: Touch homepage (detect Zzzz and retry)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          APP="nyc-taxi-dashboard"

          fetch_once () {
            ts="$(date +%s)"
            url="https://${APP}.streamlit.app/?wake=${ts}"

            echo "GET ${url}"

            # get ：body + http_code + final_url at the same time
            tmp="$(mktemp)"
            meta="$(curl -sS -L \
              --connect-timeout 10 \
              --max-time 30 \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              -H "User-Agent: github-actions-wake/1.0" \
              -o "${tmp}" \
              -w "HTTP=%{http_code} FINAL_URL=%{url_effective}\n" \
              "${url}" || true)"

            body_len="$(wc -c < "${tmp}" | tr -d ' ')"
            echo "${meta}BODY_LEN=${body_len}"

            if grep -qiE "Zzzz|gone to sleep|get this app back up" "${tmp}"; then
              echo "Detected Zzzz sleep page"
              rm -f "${tmp}"
              return 1
            fi

            echo "Homepage seems awake (no Zzzz text found)"
            rm -f "${tmp}"
            return 0
          }

          delays=(0 10 20 40)
          for d in "${delays[@]}"; do
            sleep "$d"
            if fetch_once; then
              exit 0
            fi
            echo "Not awake yet, retrying..."
          done

          echo "Still Zzzz after retries (will rely on external monitor / next schedule)"
          exit 0