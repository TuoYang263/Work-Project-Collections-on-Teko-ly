name: NYC V2 incident unit tests

on:
  push:
    branches: [feature/nyc-v2]
    paths:
      - 'Projects/NYC-Taxi-Pipeline/airflow_pipeline/scripts/diagnostics/**'
      - 'Projects/NYC-Taxi-Pipeline/airflow_pipeline/tests/test_incident_*.py'
      - '.github/workflows/nyc_v2_incident_tests.yml'
  pull_request:
    paths:
      - 'Projects/NYC-Taxi-Pipeline/airflow_pipeline/scripts/diagnostics/**'
      - 'Projects/NYC-Taxi-Pipeline/airflow_pipeline/tests/test_incident_*.py'
      - '.github/workflows/nyc_v2_incident_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incident-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Projects/NYC-Taxi-Pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Run offline incident tests
        env:
          PYTHONPATH: airflow_pipeline
        run: |
          python -m pytest -q \
            airflow_pipeline/tests/test_incident_manifest.py \
            airflow_pipeline/tests/test_incident_capture.py \
            airflow_pipeline/tests/test_incident_staging.py \
            airflow_pipeline/tests/test_incident_db_capture.py \
            airflow_pipeline/tests/test_incident_log_capture.py
