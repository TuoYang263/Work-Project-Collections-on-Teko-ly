name: Olist Portal CI

on:
  push:
    branches:
      - feature/olist-analytics-portal
      - main
    paths:
      - "Projects/Olist-Ecommerce-Analytics-Portal/portal/**"
      - ".github/workflows/olist-portal-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Projects/Olist-Ecommerce-Analytics-Portal/portal/**"
      - ".github/workflows/olist-portal-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Portal
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: Projects/Olist-Ecommerce-Analytics-Portal/portal/package-lock.json

      - name: Install dependencies
        working-directory: Projects/Olist-Ecommerce-Analytics-Portal/portal
        run: npm ci

      - name: Run tests
        working-directory: Projects/Olist-Ecommerce-Analytics-Portal/portal
        run: npm test

      - name: Run lint
        working-directory: Projects/Olist-Ecommerce-Analytics-Portal/portal
        run: npm run lint

      - name: Build production Portal
        working-directory: Projects/Olist-Ecommerce-Analytics-Portal/portal
        run: npm run build
